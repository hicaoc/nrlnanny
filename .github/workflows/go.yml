# Build nrlnanny for Linux / Windows / macOS.
#
# The project depends on CGO audio libraries (malgo, oto, go-wca), so each
# target is built on a native runner of that OS/arch instead of
# cross-compiling with GOOS/GOARCH.

name: Go Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-13
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    # oto needs ALSA headers on Linux (malgo loads libasound at runtime).
    - name: Install Linux audio dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Test
      run: go test -v ./...

    - name: Build and package
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        arch="${{ matrix.goarch }}"
        [ "$arch" = "amd64" ] && arch="x86_64"
        name="nrlnanny_${{ matrix.goos }}_${arch}"
        if [ "$RUNNER_OS" = "Windows" ]; then
          go build -v -o "${name}.exe" .
          7z a -mx=9 "${name}.zip" "${name}.exe" > /dev/null
        else
          go build -v -o "${name}" .
          tar czf "${name}.tar.gz" "${name}"
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nrlnanny-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          nrlnanny_*.zip
          nrlnanny_*.tar.gz

  # Build .rpm (yum/dnf) and .apk (Alpine) packages for the Linux server.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: ubuntu-24.04-arm
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install Linux audio dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Build
      env:
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: go build -v -o bin/nrlnanny_linux_${{ matrix.goarch }} .

    - name: Install nfpm
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

    - name: Package rpm and apk
      env:
        ARCH: ${{ matrix.goarch }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          export VERSION="${GITHUB_REF_NAME#v}"
        else
          export VERSION="0.0.0"
        fi
        export RELEASE="${GITHUB_RUN_NUMBER}"
        mkdir -p dist
        nfpm package -f nfpm.rpm.yaml -p rpm -t dist/
        nfpm package -f nfpm.apk.yaml -p apk -t dist/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nrlnanny-pkg-linux-${{ matrix.goarch }}
        path: dist/*

  # Build and push the Docker image (ghcr.io always, Docker Hub when the
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are configured).
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install Linux audio dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Build Linux binary
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 1
      run: |
        go build -v -o Docker/nrlnanny .
        cp nrlnanny.yaml Docker/nrlnanny.yaml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    - name: Prepare image list
      id: images
      run: |
        {
          echo "list<<EOF"
          echo "ghcr.io/${GITHUB_REPOSITORY,,}"
          [ -n "$DOCKERHUB_TOKEN" ] && echo "hicaoc/nrlnanny"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.list }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=sha,enable=${{ github.event_name != 'pull_request' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ./Docker
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: nrlnanny-*
        path: dist
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
